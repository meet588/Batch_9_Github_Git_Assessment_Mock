<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 400px;
        height: 250px;
        border: 2px solid black;
        background-color: aquamarine;
        position: relative;
      }

      .element {
        width: 50px;
        height: 50px;
        border-radius: 100px;
        background-color: rgb(0, 76, 255);
        position: absolute;
        top: -10px;
        right: -10px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="element"></div>
    </div>
  </body>
</html>
