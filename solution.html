<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Element - Top Right Corner</title>
    <style>
        /* Parent Element Box */
        .box {
            position: relative;         /* Needed so the child positions itself inside this box */
            width: 300px;               /* Fixed width */
            height: 300px;              /* Fixed height */
            background-color: #f0f0f0;  /* Light grey background to see the box */
            border: 2px solid #333;     /* Dark border to see the box boundaries */
            margin: 50px auto;          /* Centers the box on the screen for testing */
        }

        /* Child Element Box */
        .element {
            position: absolute;         /* Takes the element out of normal document flow */
            top: 0;                     /* Aligns it perfectly to the top edge */
            right: 0;                   /* Aligns it perfectly to the right edge */
            width: 50px;                /* Size of the child element */
            height: 50px;               /* Size of the child element */
            background-color: #ff4757;  /* Red background color to make it stand out */
        }
    </style>
</head>
<body>

    <!-- Expected HTML Structure -->
    <div class="box">
        <div class="element"></div>
    </div>

</body>
</html>
